<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <style>
    :root {
      color-scheme: light;
      --text: #202632;
      --muted: #586174;
      --line: #e6e9ef;
      --accent: #2f6fed;
      --accent-soft: #eef4ff;
      --bg: #fafafa;
      --panel: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.65;
      color: var(--text);
      background: var(--bg);
    }

    main {
      width: min(760px, calc(100% - 32px));
      margin: 0 auto;
      padding: 40px 0 64px;
    }

    header {
      padding-bottom: 22px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 28px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 28px;
      line-height: 1.25;
      color: #1c2638;
    }

    h2 {
      margin: 32px 0 10px;
      font-size: 20px;
      line-height: 1.35;
      color: var(--accent);
    }

    h3 {
      margin: 20px 0 8px;
      font-size: 16px;
    }

    p {
      margin: 0 0 12px;
    }

    ul {
      margin: 8px 0 16px;
      padding-left: 22px;
    }

    li {
      margin: 4px 0;
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .meta {
      color: var(--muted);
      font-size: 14px;
    }

    .notice {
      margin: 24px 0;
      padding: 16px;
      border: 1px solid #d7e4ff;
      border-radius: 8px;
      background: var(--accent-soft);
    }

    .panel {
      margin-top: 20px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }

    .label {
      font-weight: 700;
    }

    footer {
      margin-top: 40px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main>
    {% block content %}{% endblock %}
    <footer>
      <p>{{ app_name }} | {{ company_name }}</p>
      <p>문의: <a href="mailto:{{ contact_email }}">{{ contact_email }}</a></p>
    </footer>
  </main>
</body>
</html>
