services:
  web:
    build: .
    volumes:
      - .:/app
      - ./ARC_Quiz:/app/ARC_Quiz:ro
    expose:
      - "8000"
    env_file:
      - .env
    entrypoint: []
    command: >
      sh -c "python TheCode/manage.py collectstatic --noinput &&
      python TheCode/manage.py migrate &&
      gunicorn Clavis.wsgi:application --chdir TheCode --bind 0.0.0.0:8000 --workers 3 --timeout 45"

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.dev.conf:/etc/nginx/conf.d/default.conf
      - ./TheCode/staticfiles:/app/TheCode/staticfiles
      - ./TheCode/media:/app/TheCode/media
    depends_on:
      - web
