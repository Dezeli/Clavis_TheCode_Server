version: '3.8'

services:
  db:
    image: postgres:15
    container_name: clavis_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build: .
    container_name: clavis_web
    restart: always
    volumes:
      - .:/app
      - ./ARC_Quiz:/app/ARC_Quiz:ro
    expose:
      - "8000"
    env_file:
      - .env
    entrypoint: ./entrypoint.sh
    depends_on:
      - db

  nginx:
    image: nginx:latest
    container_name: clavis_nginx
    restart: always
    ports:
      - "127.0.0.1:8002:80"
    volumes:
      - ./nginx/default.prod.conf:/etc/nginx/conf.d/default.conf
      - ./TheCode/staticfiles:/app/TheCode/staticfiles
      - ./TheCode/media:/app/TheCode/media
    depends_on:
      - web

volumes:
  pgdata:
